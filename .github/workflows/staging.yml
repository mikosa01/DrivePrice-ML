name: Staging Area

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

permissions:
  id-token: write
  contents: read

jobs:
  tests_and_model_training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r backend/classification/requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=${GITHUB_WORKSPACE}/backend
          pytest 
        working-directory: backend/classification/

  tests_and_flask_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r backend/class_api/requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=${GITHUB_WORKSPACE}/backend
          pytest 
        working-directory: backend/class_api/
  
  Deploy-Backend:
    runs-on: ubuntu-latest
    needs: [tests_and_model_training, tests_and_flask_backend]
    env:
      FLASK_ENV: production
    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'


      
      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az account show

      # # Step 2: Log in to Azure
      # - name: Azure Login 
      #   uses: azure/login@v1
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Log in to Azure Container Registry in Docker    
        run: docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_LOGIN_SERVER }}

      # Step 4: Log in to Azure Container Registry (ACR)
      # - name: Log in to Azure Container Registry
      #   run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
      
      # Step 4: Log in to Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry
        run: |
           az acr login --name ${{ secrets.ACR_USERNAME }} --expose-token

      # Step 5: Build and tag Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/my-app:latest ./backend
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/my-app:latest ${{ secrets.ACR_LOGIN_SERVER }}/my-app:latest

      # Step 6: Push Docker image to Azure Container Registry
      - name: Push Docker Image to ACR
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/my-app:latest


      # Step 7: Deploy the container to Azure Web App
      - name: Deploy to Azure Web App
        run: |
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/my-app:latest \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }}
      # Step 8: Restart Web App to apply changes
      - name: Restart Azure Web App
        run: az webapp restart --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}

