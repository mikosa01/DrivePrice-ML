name: Staging Area

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

permissions:
  id-token: write
  contents: read

jobs:
  tests_and_model_training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r backend/classification/requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=${GITHUB_WORKSPACE}/backend
          pytest 
        working-directory: backend/classification/

  tests_and_flask_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r backend/class_api/requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=${GITHUB_WORKSPACE}/backend
          pytest 
        working-directory: backend/class_api/
  
  Deploy-Backend:
    runs-on: ubuntu-latest
    needs: [tests_and_model_training, tests_and_flask_backend]
    env:
      FLASK_ENV: production
    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Log in to Azure
      - name: Azure Login 
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      # Step 3.5: Log in to Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry IN Docker
        run: docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ ACR_PASSWORD }} ${{ ACR_LOGIN_SERVER }}
        
      # Step 4: Log in to Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login driveml.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # Step 5: Build and tag Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest ./backend
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest

      # Step 6: Push Docker image to Azure Container Registry
      - name: Push Docker Image to ACR
        run: docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest

