name: Staging Area

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "staging" branch
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  tests_and_model_training:  # Fixed the job name to be valid
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Install essential dependencies
        run: pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: pip install -r backend/classification/requirements.txt

      - name: Set PYTHONPATH and run tests
        run: |
          export PYTHONPATH=${GITHUB_WORKSPACE}/backend
          pytest 
        working-directory: backend/classification/

  tests_and_flask_backend:  # Fixed the job name to be valid
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Install essential dependencies
        run: pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r backend/class_api/requirements.txt

      - name: Set PYTHONPATH and run tests
        run: |
          export PYTHONPATH=${GITHUB_WORKSPACE}/backend
          pytest 
        working-directory: backend/class_api/


# This workflow contains a single job called "build"
  Deploy-Backend:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: [tests_and_model_training, tests_and_flask_backend]
    env:
      FLASK_ENV: production

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

       # Step 2: Install the Heroku CLI
      - name: Azure Login 
        run: azure/login@v2
        with: 
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Log in to Heroku Docker Registry
      - name: Log in to Azure Container Registry
        run: 
            az acr login --name ${{ secrets.ACR_NAME }}

      # Step 4: Build and Push the Docker Image
      - name: Build and Push Docker Image to Azure
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest ./backend
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest

      # Step 5: Release the Docker Container
      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest

      